name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Test release
        run: swift test -c release
      - name: Build app bundle
        run: ./scripts/build.sh
