name: Check & Release
on:
  push:
    branches: [main]
    # Site, hosting and docs changes deploy from the Pi; they don't need an app release.
    paths-ignore: ['site/**', 'deploy/**', '**.md']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gitgaze-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-15
            platform: macos
            target: universal-apple-darwin
            rust: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            rust: x86_64-pc-windows-msvc
          - name: Windows ARM64
            os: windows-11-arm
            platform: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            rust: aarch64-pc-windows-msvc
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Install tools
        run: npm ci
      - name: Test UI logic
        run: npm test
      - name: Test release signing
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test native shell
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build
        run: |
          VERSION="$(python3 scripts/release.py version)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          BUNDLE=$([ "${{ matrix.platform }}" = macos ] && echo app || echo nsis)
          npx tauri build --target ${{ matrix.target }} --bundles "$BUNDLE" --config "{\"version\":\"$VERSION\"}"
      - name: Collect macOS app
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/Stoke.app
          lipo "$APP/Contents/MacOS/Stoke" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Contents/Info.plist")" = app.gitbar.mac
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Contents/Info.plist")" = "$VERSION"
          "$APP/Contents/MacOS/Stoke" --smoke-test
          echo "BINARY=$APP/Contents/MacOS/Stoke" >> "$GITHUB_ENV"
          # Archive here: artifact uploads drop the executable bit inside bundles.
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/Stoke.zip
          tar -czf dist/Stoke.app.tar.gz -C "$(dirname "$APP")" Stoke.app
      - name: Collect Windows installer
        if: matrix.platform == 'windows'
        run: |
          set -euo pipefail
          EXE=src-tauri/target/${{ matrix.target }}/release/Stoke.exe
          "$EXE" --smoke-test > smoke.txt
          cat smoke.txt
          grep -q "Stoke $VERSION launch smoke test passed" smoke.txt
          echo "BINARY=$EXE" >> "$GITHUB_ENV"
          mkdir -p dist
          cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe "dist/Stoke-windows-${{ matrix.arch }}-setup.exe"
      - name: Detect a real Git push
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          git init -q --bare "$WORK/remote.git"
          git init -q "$WORK/repo"
          git -C "$WORK/repo" -c user.name=CI -c user.email=ci@example.com commit -q --allow-empty -m test
          "$BINARY" --listener-smoke-test > "$WORK/listener.txt" 2>&1 &
          PID=$!
          for i in $(seq 1 40); do [ -s "$WORK/listener.txt" ] && break; sleep 0.25; done
          TARGET="$(head -n1 "$WORK/listener.txt" | tr -d '\r')"
          echo "Trace2 target: $TARGET"
          # Git reads trace2 settings only from system and global config, never from -c.
          git config --file "$WORK/global.cfg" trace2.eventTarget "$TARGET"
          GIT_CONFIG_GLOBAL="$WORK/global.cfg" GIT_TRACE2_DST_DEBUG=1 git -C "$WORK/repo" push -q "$WORK/remote.git" HEAD:main
          wait "$PID"
          grep -q "push detected" "$WORK/listener.txt"
      - name: Install the latest release with install.ps1
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # This commit's script against the published release, in PowerShell 7 and Windows PowerShell 5.1.
          Get-Content ./install.ps1 -Raw | Invoke-Expression
          if (-not (Test-Path "$env:LOCALAPPDATA\Stoke\Stoke.exe")) { throw 'Stoke.exe was not installed' }
          Get-Process Stoke -ErrorAction SilentlyContinue | Stop-Process -Force
          powershell -NoProfile -ExecutionPolicy Bypass -Command 'Get-Content ./install.ps1 -Raw | Invoke-Expression'
          if ($LASTEXITCODE) { throw "Windows PowerShell install failed ($LASTEXITCODE)" }
          Get-Process Stoke -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch || 'universal' }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'AlexanderHeffernan/Stoke'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine immutable release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python3 scripts/release.py version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          DRAFT="$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$DRAFT" = false ]; then
            test "$(git rev-parse "v$VERSION^{commit}")" = "$GITHUB_SHA" || { echo 'Existing release belongs to another commit.' >&2; exit 1; }
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "This commit is already released as v$VERSION."
          fi
          # Only app changes ship: tests, scripts and workflow edits don't prompt users to update.
          LAST="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          if [ "$DRAFT" != false ] && [ -n "$LAST" ] && git diff --quiet "$LAST" HEAD -- ui src-tauri package.json package-lock.json; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Nothing in the app changed since $LAST; no release."
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.published != 'true'
        with:
          path: artifacts
      - name: Package, sign, and verify updates
        if: steps.version.outputs.published != 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Configure SPARKLE_PRIVATE_KEY before releasing.' >&2; exit 1; }
          bash scripts/package-release.sh "$VERSION" artifacts dist
      - name: Publish complete release for the tested commit
        if: steps.version.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file dist/notes.md
          fi
          gh release upload "$TAG" dist/Stoke.zip dist/Stoke.app.tar.gz dist/Stoke-windows-x64-setup.exe \
            dist/Stoke-windows-arm64-setup.exe dist/appcast.xml dist/latest.json dist/SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false --latest
