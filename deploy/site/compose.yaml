# Serves gitgaze.alexheffernan.dev from a checkout of main. Lives in ~/gitgaze-site on the Pi,
# next to repo/ (the checkout), tunnel-config.yml and tunnel-credentials.json. See README.md.
name: gitgaze-site
services:
  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:3013:80"]
    volumes:
      - ./repo:/srv/repo:ro
      - ./repo/deploy/site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  tunnel:
    image: cloudflare/cloudflared:2026.10.6
    restart: unless-stopped
    user: "1001:1001"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./tunnel-config.yml:/etc/cloudflared/config.yml:ro
      - ./tunnel-credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on: [web]
