[package]
name = "gitgaze"
version = "1.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "gitgaze_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
objc2-service-management = "0.3"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSImage", "NSAppearance"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["net", "io-util", "rt", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
